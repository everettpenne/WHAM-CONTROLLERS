</defs><rect class="bgp" width="1228" height="1699"/><rect x="54" y="12" width="796" height="242" rx="8" class="bc"/><rect x="54" y="276" width="796" height="726" rx="8" class="bi"/><rect x="54" y="1024" width="796" height="329" rx="8" class="ba"/><rect x="54" y="1375" width="796" height="138" rx="8" class="bf"/><rect x="54" y="1535" width="796" height="136" rx="8" class="bi"/><path d="M478,81 H530" class="ln" marker-end="url(#a)"/><path d="M278,138 V164" class="ln" marker-end="url(#a)"/><path d="M363,197 H530" class="ln" marker-end="url(#a)"/><path d="M830,197 H872" class="fl"/><path d="M278,230 V310" class="ln" marker-end="url(#a)"/><path d="M278,382 V402" class="ln" marker-end="url(#a)"/><path d="M478,438 H530" class="wl"/><path d="M278,474 V494" class="ln" marker-end="url(#a)"/><path d="M278,568 V588" class="ln" marker-end="url(#a)"/><path d="M278,678 V698" class="ln" marker-end="url(#a)"/><path d="M278,788 V808" class="ln" marker-end="url(#a)"/><path d="M278,898 V922" class="ln" marker-end="url(#a)"/><path d="M363,955 H530" class="ln" marker-end="url(#a)"/><path d="M530,897 H504 V531 H478" class="ln" marker-end="url(#a)"/><path d="M850,639 H872" class="fl"/><path d="M278,988 V1058" class="ln" marker-end="url(#a)"/><path d="M240,1085 H190" class="ln" marker-end="url(#a)"/><path d="M78,1085 H34" class="ln"/><circle cx="34" cy="1085" r="2.6" class="jt"/><path d="M278,1112 V1128" class="ln"/><path d="M141,1128 H415" class="ln"/><path d="M141,1128 V1148" class="ln" marker-end="url(#a)"/><path d="M278,1128 V1148" class="ln" marker-end="url(#a)"/><path d="M415,1128 V1148" class="ln" marker-end="url(#a)"/><path d="M141,1218 V1234" class="ln"/><path d="M278,1218 V1234" class="ln"/><path d="M415,1218 V1234" class="ln"/><path d="M141,1234 H415" class="ln"/><path d="M278,1234 V1252" class="ln" marker-end="url(#a)"/><path d="M363,1285 H530" class="ln" marker-end="url(#a)"/><path d="M850,1188 H872" class="fl"/><path d="M278,1318 V1409" class="ln" marker-end="url(#a)"/><path d="M128,1466 H104 V1442 H128" class="ln" marker-end="url(#a)"/><path d="M428,1456 H530" class="ln" marker-end="url(#a)"/><path d="M850,1444 H872" class="fl"/><path d="M278,1499 V1569" class="ln" marker-end="url(#a)"/><path d="M680,1483 V1613 H478" class="ln" marker-end="url(#a)"/><path d="M78,1613 H34" class="ln"/><circle cx="34" cy="1613" r="2.6" class="jt"/><path d="M872,1444 V63" class="fl"/><path d="M872,63 H896" class="fl" marker-end="url(#af)"/><path d="M1046,114 V134" class="ln" marker-end="url(#a)"/><path d="M1046,376 V396" class="ln" marker-end="url(#a)"/><path d="M1046,468 V488" class="ln" marker-end="url(#a)"/><path d="M1046,592 V612" class="ln" marker-end="url(#a)"/><path d="M1046,666 V690" class="ln" marker-end="url(#a)"/><path d="M1131,723 H1212 V540 H1196" class="ln" marker-end="url(#a)"/><path d="M1046,756 V784" class="ln" marker-end="url(#a)"/><path d="M896,830 H884 V1687 H34" class="ln"/><path d="M34,1687 V346 H78" class="ln" marker-end="url(#a)"/><rect x="78" y="46" width="400" height="92" rx="5" class="box"/><rect x="530" y="46" width="300" height="70" rx="5" class="box"/><polygon points="278,164 363,197 278,230 193,197" class="box"/><rect x="530" y="154" width="300" height="86" rx="5" class="box"/><rect x="78" y="310" width="400" height="72" rx="5" class="box"/><rect x="78" y="402" width="400" height="72" rx="5" class="box"/><circle cx="93" cy="439" r="3.6" class="dg"/><rect x="530" y="396" width="300" height="86" rx="5" class="warn"/><rect x="78" y="494" width="400" height="74" rx="5" class="box"/><circle cx="93" cy="531" r="3.6" class="dg"/><circle cx="93" cy="549" r="3.6" class="dg"/><rect x="78" y="588" width="400" height="90" rx="5" class="box"/><rect x="78" y="698" width="400" height="90" rx="5" class="box"/><rect x="78" y="808" width="400" height="90" rx="5" class="box"/><polygon points="278,922 363,955 278,988 193,955" class="box"/><circle cx="261.2" cy="955" r="3.6" class="dg"/><rect x="530" y="871" width="300" height="108" rx="5" class="box"/><rect x="240" y="1058" width="238" height="54" rx="5" class="box"/><rect x="78" y="1058" width="112" height="54" rx="5" class="box"/><rect x="78" y="1148" width="126" height="70" rx="5" class="box"/><circle cx="93" cy="1167" r="3.6" class="dg"/><rect x="215" y="1148" width="126" height="70" rx="5" class="box"/><circle cx="230" cy="1167" r="3.6" class="dg"/><rect x="352" y="1148" width="126" height="70" rx="5" class="box"/><polygon points="278,1252 363,1285 278,1318 193,1285" class="box"/><rect x="530" y="1231" width="300" height="108" rx="5" class="box"/><rect x="128" y="1409" width="300" height="90" rx="5" class="box"/><rect x="530" y="1429" width="300" height="54" rx="5" class="box"/><rect x="78" y="1569" width="400" height="88" rx="5" class="box"/><rect x="896" y="12" width="300" height="102" rx="5" class="fault"/><rect x="896" y="134" width="300" height="242" rx="5" class="box"/><rect x="896" y="396" width="300" height="72" rx="5" class="box"/><rect x="896" y="488" width="300" height="104" rx="5" class="box"/><rect x="896" y="612" width="300" height="54" rx="5" class="box"/><circle cx="911" cy="631" r="3.6" class="dg"/><polygon points="1046,690 1131,723 1046,756 961,723" class="box"/><rect x="896" y="784" width="300" height="92" rx="5" class="box"/><rect x="896" y="1561" width="300" height="110" rx="5" class="plain"/><text x="89" y="69" class="tt">Open TCP to the hub, port 5101</text><text x="89" y="87" class="mm">@quiet &lt;program-name&gt;</text><text x="89" y="105" class="mm">*IDN?</text><text x="89" y="123" class="mm">SYS:ID?</text><text x="541" y="69" class="tt">Check who answered</text><text x="541" y="86" class="nn">Product WHAM-XREX-PFMG474, serial WB-0003-4.</text><text x="541" y="102" class="nn">Anything else: stop.</text><text x="504" y="75" class="el" text-anchor="middle">verify</text><text x="278" y="201" class="mm" text-anchor="middle">STATE?</text><text x="541" y="177" class="tt">Anything but IDLE</text><text x="541" y="194" class="nn">OK ARMED or OK FIRING: another session</text><text x="541" y="210" class="nn">is using it. Stop and look.</text><text x="541" y="226" class="nn">OK FAULT &lt;type&gt;: take the fault path.</text><text x="78" y="34"><tspan class="tag bct">CONNECT</tspan><tspan dx="12" class="nn">one connection per program</tspan></text><text x="286" y="269" class="el">OK IDLE</text><text x="89" y="333" class="tt">Optional: start from a saved profile</text><text x="89" y="351" class="mm">CONFig:PROFile:DIFF? &lt;slot&gt;   *RCL &lt;slot&gt;</text><text x="89" y="368" class="nn">IDLE only. Check FAILED=0. Enables and ready lines are not kept.</text><text x="89" y="425" class="tt">Choose channels</text><text x="102" y="443" class="mm">SOURce:ENAble &lt;ch&gt; 1</text><text x="89" y="460" class="nn">Channels not in use: SOURce:ENAble &lt;ch&gt; 0</text><text x="541" y="419" class="tt">Fault pins are polled once enabled</text><text x="541" y="436" class="nn">A pin already at fault level trips it within</text><text x="541" y="452" class="nn">about a millisecond. Images built before</text><text x="541" y="468" class="nn">2026-11-09 missed this (seen on XR1).</text><text x="89" y="517" class="tt">Ready lines, each channel in use</text><text x="102" y="535" class="mm">XREX:CHANnel:ENAOut &lt;ch&gt; 1</text><text x="102" y="553" class="mm">XREX:CHANnel:CONTactOut &lt;ch&gt; 1</text><text x="89" y="611" class="tt">Control, each channel</text><text x="89" y="629" class="mm">PID:LOOPMODE &lt;ch&gt; &lt;0|1&gt;</text><text x="89" y="647" class="mm">PID:GAINS &lt;ch&gt; &lt;kp&gt; &lt;ki&gt; &lt;kd&gt;</text><text x="89" y="664" class="nn">Loop mode 1 = closed loop, 0 = open loop</text><text x="89" y="721" class="tt">Shot trapezoid</text><text x="89" y="739" class="mm">SHOT:TIMing &lt;up&gt; &lt;flat&gt; &lt;down&gt;</text><text x="89" y="757" class="mm">SHOT:CURRent &lt;ch&gt; &lt;amps&gt;</text><text x="89" y="774" class="nn">Seconds, shared by all channels. Must be set after every reset.</text><text x="89" y="831" class="tt">Read back, and arm the log if wanted</text><text x="89" y="849" class="mm">SHOT:TIMing?   SHOT:CURRent? &lt;ch&gt;</text><text x="89" y="867" class="mm">LOG:ARM &lt;ch|0&gt; &lt;maxSamples&gt; &lt;decim&gt;</text><text x="89" y="884" class="nn">ch 0 = all channels together, up to 1750 samples</text><text x="284" y="959" class="mm" text-anchor="middle">ARM</text><text x="541" y="894" class="tt">ARM refused</text><text x="541" y="912" class="mm">ERR 15  PF13 interlock LOW</text><text x="541" y="930" class="mm">ERR 13  Channel &lt;n&gt; lines not set</text><text x="541" y="948" class="mm">ERR 13  not currently IDLE</text><text x="541" y="965" class="nn">Only the first failed check is reported.</text><text x="371" y="949" class="el">ERR</text><text x="518" y="714" class="el" text-anchor="middle" transform="rotate(-90 518 714)">fix it, then ARM again</text><text x="78" y="298"><tspan class="tag bit">IDLE</tspan><tspan dx="12" class="nn">configure here, output is off</tspan></text><text x="251" y="1081" class="mm">STATE?</text><text x="251" y="1098" class="nn">expect OK ARMED</text><text x="89" y="1081" class="mm">DISARM</text><text x="89" y="1098" class="nn">stand down</text><text x="286" y="1017" class="el">OK</text><text x="215" y="1079" class="el" text-anchor="middle">no shot</text><text x="42" y="1079" class="el">IDLE</text><text x="102" y="1171" class="mm">SHOT:STARt</text><text x="89" y="1188" class="nn">profiled shot,</text><text x="89" y="1204" class="nn">ends by itself</text><text x="239" y="1171" class="mm">SOURce:RUN</text><text x="226" y="1188" class="nn">continuous, runs</text><text x="226" y="1204" class="nn">until SOURce:STOP</text><text x="363" y="1171" class="tt">PF15 rising edge</text><text x="363" y="1188" class="nn">hardware trigger,</text><text x="363" y="1204" class="nn">on by default</text><text x="278" y="1289" class="nb" text-anchor="middle">Accepted?</text><text x="541" y="1254" class="tt">Start refused, state stays ARMED</text><text x="541" y="1272" class="mm">ERR 13  Must ARM first</text><text x="541" y="1290" class="mm">ERR 15  PF13 LOW at firing</text><text x="541" y="1308" class="mm">ERR 12  SHOT:TIMing not set</text><text x="541" y="1325" class="nn">A refused PF15 edge gives no reply.</text><text x="371" y="1279" class="el">no</text><text x="78" y="1046"><tspan class="tag bat">ARMED</tspan><tspan dx="12" class="nn">nothing electrical yet</tspan></text><text x="139" y="1432" class="tt">Poll a few times a second</text><text x="139" y="1450" class="mm">STATE?</text><text x="139" y="1468" class="mm">SOURce:STATus? &lt;ch&gt;</text><text x="139" y="1485" class="nn">running, setpoint, measured, output (Hz)</text><text x="286" y="1368" class="el">OK</text><text x="92" y="1458" class="el" text-anchor="middle" transform="rotate(-90 92 1458)">OK FIRING</text><text x="541" y="1452" class="mm">SOURce:STOP</text><text x="541" y="1469" class="nn">Abort. Stops everything, back to IDLE.</text><text x="479" y="1450" class="el" text-anchor="middle">abort</text><text x="78" y="1397"><tspan class="tag bft">FIRING</tspan><tspan dx="12" class="nn">output is on</tspan></text><text x="89" y="1592" class="tt">Read the log, one channel at a time</text><text x="89" y="1610" class="mm">LOG:DATA? &lt;ch&gt;</text><text x="89" y="1627" class="nn">One long line: OK &lt;count&gt; &lt;rateHz&gt;, then setpoint, measured,</text><text x="89" y="1643" class="nn">output in Hz per sample. Allow a read timeout of 40 s or more.</text><text x="286" y="1528" class="el">OK IDLE, the shot ended by itself</text><text x="42" y="1607" class="el">IDLE</text><text x="78" y="1557"><tspan class="tag bit">IDLE</tspan><tspan dx="12" class="nn">shot over, output is off</tspan></text><text x="907" y="35" class="tt">FAULT latched, from any state</text><text x="907" y="52" class="nn">General or interlock fault while firing: all</text><text x="907" y="68" class="nn">channels ramp down over the ramp time (1.0 s).</text><text x="907" y="84" class="nn">One-channel fault while firing: that channel</text><text x="907" y="100" class="nn">off at once, the others derate, then ramp down.</text><text x="889" y="330" class="el fe" text-anchor="middle" transform="rotate(-90 889 330)">a fault can arrive in any state</text><text x="907" y="157" class="tt">Read the type, then the cause</text><text x="907" y="175" class="mm">STATE?</text><text x="907" y="192" class="nn">OK FAULT &lt;type&gt; [ch] ACTIVE=WATER1,OCP3</text><text x="907" y="208" class="nn">ACTIVE= lists every fault measured.</text><text x="907" y="224" class="nn">OK FAULT GENERAL (water, temp, hardware input)</text><text x="907" y="241" class="mm">XREX:CHANnel:STATus? &lt;ch&gt;   GDS?</text><text x="907" y="258" class="nn">OK FAULT OVERCURRENT &lt;ch&gt; or ENERPRO &lt;ch&gt;</text><text x="907" y="275" class="mm">XREX:CHANnel:STATus? &lt;ch&gt;</text><text x="907" y="292" class="nn">OK FAULT ENABLE_OUTPUT &lt;ch&gt;</text><text x="907" y="309" class="mm">XREX:CHANnel:ENAOut? &lt;ch&gt;</text><text x="907" y="327" class="mm">XREX:CHANnel:CONTactOut? &lt;ch&gt;</text><text x="907" y="344" class="nn">OK FAULT EXTERNAL_ENABLE</text><text x="907" y="361" class="mm">EXTernal:INPut?</text><text x="907" y="419" class="tt">Wait out the ramp</text><text x="907" y="437" class="mm">SOURce:STATus? &lt;ch&gt;</text><text x="907" y="454" class="nn">First field (running) must be 0.</text><text x="907" y="511" class="tt">A person finds and removes the cause</text><text x="907" y="529" class="mm">SYS:EVLOG?</text><text x="907" y="546" class="nn">Event order and times since boot. (Live !EVT</text><text x="907" y="562" class="nn">lines are off unless SYS:EVENT 1 was sent.)</text><text x="907" y="578" class="nn">Never auto-clear a fault that hit while firing.</text><text x="920" y="635" class="mm">FAULT:CLEar</text><text x="907" y="652" class="nn">Replies OK whether or not it cleared.</text><text x="1046" y="727" class="mm" text-anchor="middle">STATE?</text><text x="1224" y="631" class="el" text-anchor="middle" transform="rotate(-90 1224 631)">OK FAULT: still latched</text><text x="907" y="807" class="tt">Re-check what the fault dropped</text><text x="907" y="825" class="mm">SOURce:ENAble? &lt;ch&gt;</text><text x="907" y="843" class="mm">XREX:CHANnel:ENAOut? &lt;ch&gt;</text><text x="907" y="861" class="mm">XREX:CHANnel:CONTactOut? &lt;ch&gt;</text><text x="1054" y="774" class="el">OK IDLE</text><text x="26" y="1016" class="el" text-anchor="middle" transform="rotate(-90 26 1016)">Back to IDLE. Settings stay until a reset. Every shot needs its own ARM.</text><text x="907" y="1584" class="tt">Queries work in every state</text><text x="907" y="1602" class="mm">STATE?   FAULT?   GDS?</text><text x="907" y="1620" class="mm">XREX:CHANnel:STATus? &lt;ch&gt;</text><text x="907" y="1638" class="mm">SOURce:STATus? &lt;ch&gt;</text><text x="907" y="1656" class="mm">EXTernal:INPut?   SYS:EVLOG?</text></svg>
