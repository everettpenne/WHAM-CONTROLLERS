<?xml version="1.0" encoding="UTF-8"?>
<svg width="1228" height="1607" viewBox="0 0 1228 1607" role="img" aria-label="Flowchart of XREX serial commands. Connect and identify, confirm IDLE, configure channels, ready lines, control and shot settings, ARM, start a shot, poll while firing, read the log, and return to IDLE. A fault from any state leads to reading its type, removing the cause, FAULT:CLEar, and a STATE? check before returning to IDLE." xmlns="http://www.w3.org/2000/svg"><style>text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#17232b}
.tt{font-weight:600;font-size:13px}
.mm{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.nn{font-size:12px;fill:#54636d}
.nb{font-size:13px;font-weight:600}
.el{font-size:11.5px;fill:#54636d}
.fe{fill:#ad1240}
.tag{font-weight:700;font-size:15px;letter-spacing:.08em}
.bct{fill:#3e4d57}.bit{fill:#2a5a78}.bat{fill:#835600}.bft{fill:#ad3a12}
.bc{fill:#e3e8ea}.bi{fill:#dfe7ec}.ba{fill:#f6ebcb}.bf{fill:#f8ddd0}
.box{fill:#fbfcfc;stroke:#47565f;stroke-width:1}
.plain{fill:none;stroke:#c5ced3;stroke-width:1}
.fault{fill:#f8dfe5;stroke:#ad1240;stroke-width:1.4}
.warn{fill:#fff5da;stroke:#a87200;stroke-width:1.2}
.dg{fill:#c8421a}
.ln{fill:none;stroke:#47565f;stroke-width:1.3}
.fl{fill:none;stroke:#ad1240;stroke-width:1.5;stroke-dasharray:6 4}
.wl{fill:none;stroke:#a87200;stroke-width:1.2;stroke-dasharray:2 3}
.jt{fill:#47565f}
.ah{fill:#47565f}.ahf{fill:#ad1240}
:root{color:#47565f}@media (prefers-color-scheme:dark){text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#e6edf0}
.tt{font-weight:600;font-size:13px}
.mm{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
