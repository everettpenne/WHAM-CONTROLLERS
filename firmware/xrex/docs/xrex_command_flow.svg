.ah{fill:#a7b5bd}.ahf{fill:#f07f9c}
:root{color:#a7b5bd}.bgp{fill:#1a242b}}.bgp{fill:#fbfcfc}</style><defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="ah"/></marker>
<marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="ahf"/></marker>
</defs><rect class="bgp" width="1228" height="1607"/><rect x="54" y="12" width="796" height="242" rx="8" class="bc"/><rect x="54" y="276" width="796" height="634" rx="8" class="bi"/><rect x="54" y="932" width="796" height="329" rx="8" class="ba"/><rect x="54" y="1283" width="796" height="138" rx="8" class="bf"/><rect x="54" y="1443" width="796" height="136" rx="8" class="bi"/><path d="M478,81 H530" class="ln" marker-end="url(#a)"/><path d="M278,138 V164" class="ln" marker-end="url(#a)"/><path d="M363,197 H530" class="ln" marker-end="url(#a)"/><path d="M830,197 H872" class="fl"/><path d="M278,230 V310" class="ln" marker-end="url(#a)"/><path d="M478,346 H530" class="wl"/><path d="M278,382 V402" class="ln" marker-end="url(#a)"/><path d="M278,476 V496" class="ln" marker-end="url(#a)"/><path d="M278,586 V606" class="ln" marker-end="url(#a)"/><path d="M278,696 V716" class="ln" marker-end="url(#a)"/><path d="M278,806 V830" class="ln" marker-end="url(#a)"/><path d="M363,863 H530" class="ln" marker-end="url(#a)"/><path d="M530,805 H504 V439 H478" class="ln" marker-end="url(#a)"/><path d="M850,593 H872" class="fl"/><path d="M278,896 V966" class="ln" marker-end="url(#a)"/><path d="M240,993 H190" class="ln" marker-end="url(#a)"/><path d="M78,993 H34" class="ln"/><circle cx="34" cy="993" r="2.6" class="jt"/><path d="M278,1020 V1036" class="ln"/><path d="M141,1036 H415" class="ln"/><path d="M141,1036 V1056" class="ln" marker-end="url(#a)"/><path d="M278,1036 V1056" class="ln" marker-end="url(#a)"/><path d="M415,1036 V1056" class="ln" marker-end="url(#a)"/><path d="M141,1126 V1142" class="ln"/><path d="M278,1126 V1142" class="ln"/><path d="M415,1126 V1142" class="ln"/><path d="M141,1142 H415" class="ln"/><path d="M278,1142 V1160" class="ln" marker-end="url(#a)"/><path d="M363,1193 H530" class="ln" marker-end="url(#a)"/><path d="M850,1096 H872" class="fl"/><path d="M278,1226 V1317" class="ln" marker-end="url(#a)"/><path d="M128,1374 H104 V1350 H128" class="ln" marker-end="url(#a)"/><path d="M428,1364 H530" class="ln" marker-end="url(#a)"/><path d="M850,1352 H872" class="fl"/><path d="M278,1407 V1477" class="ln" marker-end="url(#a)"/><path d="M680,1391 V1521 H478" class="ln" marker-end="url(#a)"/><path d="M78,1521 H34" class="ln"/><circle cx="34" cy="1521" r="2.6" class="jt"/><path d="M872,1352 V63" class="fl"/><path d="M872,63 H896" class="fl" marker-end="url(#af)"/><path d="M1046,114 V134" class="ln" marker-end="url(#a)"/><path d="M1046,376 V396" class="ln" marker-end="url(#a)"/><path d="M1046,468 V488" class="ln" marker-end="url(#a)"/><path d="M1046,576 V596" class="ln" marker-end="url(#a)"/><path d="M1046,650 V674" class="ln" marker-end="url(#a)"/><path d="M1131,707 H1212 V532 H1196" class="ln" marker-end="url(#a)"/><path d="M1046,740 V768" class="ln" marker-end="url(#a)"/><path d="M896,814 H884 V1595 H34" class="ln"/><path d="M34,1595 V346 H78" class="ln" marker-end="url(#a)"/><rect x="78" y="46" width="400" height="92" rx="5" class="box"/><rect x="530" y="46" width="300" height="70" rx="5" class="box"/><polygon points="278,164 363,197 278,230 193,197" class="box"/><rect x="530" y="154" width="300" height="86" rx="5" class="box"/><rect x="78" y="310" width="400" height="72" rx="5" class="box"/><circle cx="93" cy="347" r="3.6" class="dg"/><rect x="530" y="304" width="300" height="86" rx="5" class="warn"/><rect x="78" y="402" width="400" height="74" rx="5" class="box"/><circle cx="93" cy="439" r="3.6" class="dg"/><circle cx="93" cy="457" r="3.6" class="dg"/><rect x="78" y="496" width="400" height="90" rx="5" class="box"/><rect x="78" y="606" width="400" height="90" rx="5" class="box"/><rect x="78" y="716" width="400" height="90" rx="5" class="box"/><polygon points="278,830 363,863 278,896 193,863" class="box"/><circle cx="261.2" cy="863" r="3.6" class="dg"/><rect x="530" y="779" width="300" height="108" rx="5" class="box"/><rect x="240" y="966" width="238" height="54" rx="5" class="box"/><rect x="78" y="966" width="112" height="54" rx="5" class="box"/><rect x="78" y="1056" width="126" height="70" rx="5" class="box"/><circle cx="93" cy="1075" r="3.6" class="dg"/><rect x="215" y="1056" width="126" height="70" rx="5" class="box"/><circle cx="230" cy="1075" r="3.6" class="dg"/><rect x="352" y="1056" width="126" height="70" rx="5" class="box"/><polygon points="278,1160 363,1193 278,1226 193,1193" class="box"/><rect x="530" y="1139" width="300" height="108" rx="5" class="box"/><rect x="128" y="1317" width="300" height="90" rx="5" class="box"/><rect x="530" y="1337" width="300" height="54" rx="5" class="box"/><rect x="78" y="1477" width="400" height="88" rx="5" class="box"/><rect x="896" y="12" width="300" height="102" rx="5" class="fault"/><rect x="896" y="134" width="300" height="242" rx="5" class="box"/><rect x="896" y="396" width="300" height="72" rx="5" class="box"/><rect x="896" y="488" width="300" height="88" rx="5" class="box"/><rect x="896" y="596" width="300" height="54" rx="5" class="box"/><circle cx="911" cy="615" r="3.6" class="dg"/><polygon points="1046,674 1131,707 1046,740 961,707" class="box"/><rect x="896" y="768" width="300" height="92" rx="5" class="box"/><rect x="896" y="1469" width="300" height="110" rx="5" class="plain"/><text x="89" y="69" class="tt">Open TCP to the hub, port 5101</text><text x="89" y="87" class="mm">@quiet &lt;program-name&gt;</text><text x="89" y="105" class="mm">*IDN?</text><text x="89" y="123" class="mm">SYS:ID?</text><text x="541" y="69" class="tt">Check who answered</text><text x="541" y="86" class="nn">Product WHAM-XREX-PFMG474, serial WB-0003-4.</text><text x="541" y="102" class="nn">Anything else: stop.</text><text x="504" y="75" class="el" text-anchor="middle">verify</text><text x="278" y="201" class="mm" text-anchor="middle">STATE?</text><text x="541" y="177" class="tt">Anything but IDLE</text><text x="541" y="194" class="nn">OK ARMED or OK FIRING: another session</text><text x="541" y="210" class="nn">is using it. Stop and look.</text><text x="541" y="226" class="nn">OK FAULT &lt;type&gt;: take the fault path.</text><text x="78" y="34" class="tag bct">CONNECT</text><text x="161.5" y="34" class="nn">one connection per program</text><text x="286" y="269" class="el">OK IDLE</text><text x="89" y="333" class="tt">Choose channels</text><text x="102" y="351" class="mm">SOURce:ENAble &lt;ch&gt; 1</text><text x="89" y="368" class="nn">Channels not in use: SOURce:ENAble &lt;ch&gt; 0</text><text x="541" y="327" class="tt">Fault pins are polled once enabled</text><text x="541" y="344" class="nn">A pin already at fault level trips it within</text><text x="541" y="360" class="nn">about a millisecond. Images built before</text><text x="541" y="376" class="nn">2026-11-09 missed this (seen on XR1).</text><text x="89" y="425" class="tt">Ready lines, each channel in use</text><text x="102" y="443" class="mm">XREX:CHANnel:ENAOut &lt;ch&gt; 1</text><text x="102" y="461" class="mm">XREX:CHANnel:CONTactOut &lt;ch&gt; 1</text><text x="89" y="519" class="tt">Control, each channel</text><text x="89" y="537" class="mm">PID:LOOPMODE &lt;ch&gt; &lt;0|1&gt;</text><text x="89" y="555" class="mm">PID:GAINS &lt;ch&gt; &lt;kp&gt; &lt;ki&gt; &lt;kd&gt;</text><text x="89" y="572" class="nn">Loop mode 1 = closed loop, 0 = open loop</text><text x="89" y="629" class="tt">Shot trapezoid</text><text x="89" y="647" class="mm">SHOT:TIMing &lt;up&gt; &lt;flat&gt; &lt;down&gt;</text><text x="89" y="665" class="mm">SHOT:CURRent &lt;ch&gt; &lt;amps&gt;</text><text x="89" y="682" class="nn">Seconds, shared by all channels. Must be set after every reset.</text><text x="89" y="739" class="tt">Read back, and arm the log if wanted</text><text x="89" y="757" class="mm">SHOT:TIMing?   SHOT:CURRent? &lt;ch&gt;</text><text x="89" y="775" class="mm">LOG:ARM &lt;ch|0&gt; &lt;maxSamples&gt; &lt;decim&gt;</text><text x="89" y="792" class="nn">ch 0 = all channels together, up to 1750 samples</text><text x="284" y="867" class="mm" text-anchor="middle">ARM</text><text x="541" y="802" class="tt">ARM refused</text><text x="541" y="820" class="mm">ERR 15  PF13 interlock LOW</text><text x="541" y="838" class="mm">ERR 13  Channel &lt;n&gt; lines not set</text><text x="541" y="856" class="mm">ERR 13  not currently IDLE</text><text x="541" y="873" class="nn">Only the first failed check is reported.</text><text x="371" y="857" class="el">ERR</text><text x="518" y="622" class="el" text-anchor="middle" transform="rotate(-90 518 622)">fix it, then ARM again</text><text x="78" y="298" class="tag bit">IDLE</text><text x="130.0" y="298" class="nn">configure here, output is off</text><text x="251" y="989" class="mm">STATE?</text><text x="251" y="1006" class="nn">expect OK ARMED</text><text x="89" y="989" class="mm">DISARM</text><text x="89" y="1006" class="nn">stand down</text><text x="286" y="925" class="el">OK</text><text x="215" y="987" class="el" text-anchor="middle">no shot</text><text x="42" y="987" class="el">IDLE</text><text x="102" y="1079" class="mm">SHOT:STARt</text><text x="89" y="1096" class="nn">profiled shot,</text><text x="89" y="1112" class="nn">ends by itself</text><text x="239" y="1079" class="mm">SOURce:RUN</text><text x="226" y="1096" class="nn">continuous, runs</text><text x="226" y="1112" class="nn">until SOURce:STOP</text><text x="363" y="1079" class="tt">PF15 rising edge</text><text x="363" y="1096" class="nn">hardware trigger,</text><text x="363" y="1112" class="nn">on by default</text><text x="278" y="1197" class="nb" text-anchor="middle">Accepted?</text><text x="541" y="1162" class="tt">Start refused, state stays ARMED</text><text x="541" y="1180" class="mm">ERR 13  Must ARM first</text><text x="541" y="1198" class="mm">ERR 15  PF13 LOW at firing</text><text x="541" y="1216" class="mm">ERR 12  SHOT:TIMing not set</text><text x="541" y="1233" class="nn">A refused PF15 edge gives no reply.</text><text x="371" y="1187" class="el">no</text><text x="78" y="954" class="tag bat">ARMED</text><text x="140.5" y="954" class="nn">nothing electrical yet</text><text x="139" y="1340" class="tt">Poll a few times a second</text><text x="139" y="1358" class="mm">STATE?</text><text x="139" y="1376" class="mm">SOURce:STATus? &lt;ch&gt;</text><text x="139" y="1393" class="nn">running, setpoint, measured, output (Hz)</text><text x="286" y="1276" class="el">OK</text><text x="92" y="1366" class="el" text-anchor="middle" transform="rotate(-90 92 1366)">OK FIRING</text><text x="541" y="1360" class="mm">SOURce:STOP</text><text x="541" y="1377" class="nn">Abort. Stops everything, back to IDLE.</text><text x="479" y="1358" class="el" text-anchor="middle">abort</text><text x="78" y="1305" class="tag bft">FIRING</text><text x="151.0" y="1305" class="nn">output is on</text><text x="89" y="1500" class="tt">Read the log, one channel at a time</text><text x="89" y="1518" class="mm">LOG:DATA? &lt;ch&gt;</text><text x="89" y="1535" class="nn">One long line: OK &lt;count&gt; &lt;rateHz&gt;, then setpoint, measured,</text><text x="89" y="1551" class="nn">output in Hz per sample. Allow a read timeout of 40 s or more.</text><text x="286" y="1436" class="el">OK IDLE, the shot ended by itself</text><text x="42" y="1515" class="el">IDLE</text><text x="78" y="1465" class="tag bit">IDLE</text><text x="130.0" y="1465" class="nn">shot over, output is off</text><text x="907" y="35" class="tt">FAULT latched, from any state</text><text x="907" y="52" class="nn">General or interlock fault while firing: all</text><text x="907" y="68" class="nn">channels ramp down over the ramp time (1.0 s).</text><text x="907" y="84" class="nn">One-channel fault while firing: that channel</text><text x="907" y="100" class="nn">off at once, the others derate, then ramp down.</text><text x="889" y="330" class="el fe" text-anchor="middle" transform="rotate(-90 889 330)">a fault can arrive in any state</text><text x="907" y="157" class="tt">Read the type, then the cause</text><text x="907" y="175" class="mm">STATE?</text><text x="907" y="192" class="nn">OK FAULT &lt;type&gt; [ch] ACTIVE=WATER1,OCP3</text><text x="907" y="208" class="nn">ACTIVE= lists every fault measured.</text><text x="907" y="224" class="nn">OK FAULT GENERAL (water, temp, hardware input)</text><text x="907" y="241" class="mm">XREX:CHANnel:STATus? &lt;ch&gt;   GDS?</text><text x="907" y="258" class="nn">OK FAULT OVERCURRENT &lt;ch&gt; or ENERPRO &lt;ch&gt;</text><text x="907" y="275" class="mm">XREX:CHANnel:STATus? &lt;ch&gt;</text><text x="907" y="292" class="nn">OK FAULT ENABLE_OUTPUT &lt;ch&gt;</text><text x="907" y="309" class="mm">XREX:CHANnel:ENAOut? &lt;ch&gt;</text><text x="907" y="327" class="mm">XREX:CHANnel:CONTactOut? &lt;ch&gt;</text><text x="907" y="344" class="nn">OK FAULT EXTERNAL_ENABLE</text><text x="907" y="361" class="mm">EXTernal:INPut?</text><text x="907" y="419" class="tt">Wait out the ramp</text><text x="907" y="437" class="mm">SOURce:STATus? &lt;ch&gt;</text><text x="907" y="454" class="nn">First field (running) must be 0.</text><text x="907" y="511" class="tt">A person finds and removes the cause</text><text x="907" y="529" class="mm">SYS:EVLOG?</text><text x="907" y="546" class="nn">Event order and times since boot.</text><text x="907" y="562" class="nn">Never auto-clear a fault that hit while firing.</text><text x="920" y="619" class="mm">FAULT:CLEar</text><text x="907" y="636" class="nn">Replies OK whether or not it cleared.</text><text x="1046" y="711" class="mm" text-anchor="middle">STATE?</text><text x="1224" y="619" class="el" text-anchor="middle" transform="rotate(-90 1224 619)">OK FAULT: still latched</text><text x="907" y="791" class="tt">Re-check what the fault dropped</text><text x="907" y="809" class="mm">SOURce:ENAble? &lt;ch&gt;</text><text x="907" y="827" class="mm">XREX:CHANnel:ENAOut? &lt;ch&gt;</text><text x="907" y="845" class="mm">XREX:CHANnel:CONTactOut? &lt;ch&gt;</text><text x="1054" y="758" class="el">OK IDLE</text><text x="26" y="970" class="el" text-anchor="middle" transform="rotate(-90 26 970)">Back to IDLE. Settings stay until a reset. Every shot needs its own ARM.</text><text x="907" y="1492" class="tt">Queries work in every state</text><text x="907" y="1510" class="mm">STATE?   FAULT?   GDS?</text><text x="907" y="1528" class="mm">XREX:CHANnel:STATus? &lt;ch&gt;</text><text x="907" y="1546" class="mm">SOURce:STATus? &lt;ch&gt;</text><text x="907" y="1564" class="mm">EXTernal:INPut?   SYS:EVLOG?</text></svg>
